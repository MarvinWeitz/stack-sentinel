specVersion: "3.1"
metadata:
  name: demo.app1
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ui5:
          path:
            - /resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://backend.example
            version: 7.7.7
