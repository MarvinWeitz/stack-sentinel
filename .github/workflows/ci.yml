name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 5 * * 1" # Mondays 05:43 UTC
  workflow_dispatch:
jobs:
  test:
    name: Test features (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  test-summary:
    # The single check that branch protection requires, so the rule does not have to list
    # every Node version in the matrix. always() makes it run, and fail, when a test job
    # fails; a skipped required check would count as passing.
    name: Test features
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
  live-feed:
    # Checks that the real feeds still have the expected format. Needs the publishers'
    # servers, so it must not block pushes or pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:live
