name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 5 * * 1" # Mondays 05:43 UTC
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  live-feed:
    # Checks that the real feeds still have the expected format. Needs the publishers'
    # servers, so it must not block pushes or pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:live
