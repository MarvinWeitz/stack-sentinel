name: Promote to stable
# Moves the "stable" branch, which customer pipelines install from, to a tested commit,
# and publishes that commit as a release. Started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to promote
        default: main
      dry_run:
        description: Only run the checks, change nothing
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # the full history is needed to check that stable only moves forward
          persist-credentials: true # the last step pushes the stable branch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:live
      - name: Check that this commit may become stable
        id: check
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate: $SHA (version $VERSION)"

          if git fetch --quiet origin refs/heads/stable:refs/remotes/origin/stable 2>/dev/null; then
            STABLE=$(git rev-parse origin/stable)
            if [ "$STABLE" = "$SHA" ]; then
              echo "::notice::stable is already at this commit; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # stable only ever moves forward, so a pipeline never gets older code than before
            if ! git merge-base --is-ancestor "$STABLE" "$SHA"; then
              echo "::error::stable ($STABLE) is not part of this commit's history, so this would move it backwards or sideways."
              exit 1
            fi
            OLD=$(git show origin/stable:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            # every promotion needs its own version, because reports identify the tool by it
            NEWER=$(node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); console.log((a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) > 0)' "$VERSION" "$OLD")
            if [ "$NEWER" != "true" ]; then
              echo "::error::package.json still says $VERSION, and stable is at $OLD. Raise the version before promoting."
              exit 1
            fi
            echo "stable moves from $OLD ($STABLE) to $VERSION"
          else
            echo "stable does not exist yet; it will be created."
          fi

          TAGGED=$(git ls-remote --tags origin "refs/tags/v$VERSION^{}" "refs/tags/v$VERSION" | tail -1 | cut -f1)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$SHA" ]; then
            echo "::error::The tag v$VERSION already exists and points at a different commit ($TAGGED)."
            exit 1
          fi
          [ -n "$TAGGED" ] && echo "tag_exists=true" >> "$GITHUB_OUTPUT" || true
      - name: Publish the release and move stable
        if: ${{ !inputs.dry_run && steps.check.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG_EXISTS: ${{ steps.check.outputs.tag_exists }}
        run: |
          if [ "$TAG_EXISTS" != "true" ]; then
            gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --generate-notes
          fi
          git push origin "$SHA:refs/heads/stable"
          echo "::notice::stable is now at version $VERSION ($SHA)."
      - name: Dry run summary
        if: ${{ inputs.dry_run && steps.check.outputs.skip != 'true' }}
        run: echo "::notice::Dry run passed. Version ${{ steps.check.outputs.version }} could be promoted; nothing was changed."
